{% extends 'base.html' %}
{% load static %}

{% block title %}Восстановление пароля — Edu Point{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/lms.css' %}?v=20260807-lms">
{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-card">
    <img src="{% static 'images/edu_logo.png' %}" alt="Edu Point" class="auth-logo">
    <h1>Восстановление пароля</h1>
    <p class="auth-sub">Введите email или логин аккаунта — пришлём инструкцию.</p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label-lms">Email</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required autofocus>
      </div>
      <button type="submit" class="btn-primary-ep w-100 justify-content-center py-2">
        <i class="bi bi-envelope me-2"></i> Отправить инструкцию
      </button>
    </form>

    <div class="auth-links">
      <a href="{% url 'lms:login' %}"><i class="bi bi-arrow-left"></i> Вернуться ко входу</a>
    </div>
  </div>
</section>
{% endblock %}
